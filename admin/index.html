<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creación WebAR - Panel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#f4f6f9;}
header{background:#111827;color:#fff;padding:18px 30px;font-size:24px;font-weight:bold;}
.container{padding:30px;}
.card{background:#fff;border-radius:12px;padding:25px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:700px;}
h2{margin-bottom:20px;}
input{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ccc;border-radius:8px;}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:18px;cursor:pointer;}
button:hover{background:#1d4ed8;}
</style>
</head>

<body>

<header>Creación WebAR - Panel de Administración</header>

<div class="container">
<div class="card">

<h2>Nuevo Proyecto</h2>

<input type="text" placeholder="Nombre del cliente">
<input type="text" placeholder="Tipo de evento">
<input type="file" accept="image/*">
<input type="file" accept="video/*">

<button id="crearProyecto">Crear Proyecto</button>

</div>
</div>

<script>
alert("JavaScript cargado correctamente");

const boton = document.getElementById("crearProyecto");

console.log(boton);

boton.addEventListener("click", () => {
    alert("El botón funciona");
});
</script>

</body>
</html>

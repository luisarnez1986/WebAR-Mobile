<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creación WebAR - Panel de Administración</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #111827;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 25px;
    }

    header h1 {
      font-size: 30px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    h2 {
      font-size: 30px;
      margin-bottom: 28px;
    }

    .campo {
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 18px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 17px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input[type="file"] {
      padding: 16px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 10px;
      background: #173477;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #10275c;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    #estado {
      margin-top: 22px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .exito {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .procesando {
      display: block !important;
      background: #e0f2fe;
      color: #075985;
    }
  </style>
</head>

<body>

  <header>
    <h1>Creación WebAR - Panel de Administración</h1>
  </header>

  <main>

    <div class="card">

      <h2>Nuevo Proyecto</h2>

      <form id="formProyecto">

        <div class="campo">
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Nombre del proyecto"
            required
          >
        </div>

        <div class="campo">
          <textarea
            id="descripcion"
            name="descripcion"
            placeholder="Descripción del proyecto"
          ></textarea>
        </div>

        <div class="campo">
          <input
            type="file"
            id="imagen"
            name="imagen"
            accept="image/*"
            required
          >
        </div>

        <div class="campo">
          <input
            type="file"
            id="video"
            name="video"
            accept="video/*"
            required
          >
        </div>

        <button
          type="submit"
          id="botonCrear"
        >
          Crear Proyecto
        </button>

      </form>

      <div id="estado"></div>

    </div>

  </main>

  <script>

    const formulario = document.getElementById("formProyecto");
    const botonCrear = document.getElementById("botonCrear");
    const estado = document.getElementById("estado");

    formulario.addEventListener("submit", async function(event) {

      event.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const descripcion = document.getElementById("descripcion").value.trim();
      const imagen = document.getElementById("imagen").files[0];
      const video = document.getElementById("video").files[0];

      if (!nombre) {
        alert("Escribe el nombre del proyecto.");
        return;
      }

      if (!imagen) {
        alert("Selecciona una imagen.");
        return;
      }

      if (!video) {
        alert("Selecciona un video.");
        return;
      }

      const formData = new FormData();

      formData.append("nombre", nombre);
      formData.append("descripcion", descripcion);
      formData.append("imagen", imagen);
      formData.append("video", video);

      botonCrear.disabled = true;
      botonCrear.textContent = "Procesando proyecto...";

      estado.className = "procesando";
      estado.textContent = "Subiendo imagen y video...";

      try {

        const respuesta = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        let datos;

        try {
          datos = await respuesta.json();
        } catch (errorJSON) {
          throw new Error(
            "El servidor respondió con un formato no válido. Código HTTP: " +
            respuesta.status
          );
        }

        console.log("Respuesta API:", datos);

        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.error ||
            datos.mensaje ||
            "Error desconocido al crear el proyecto"
          );

        }

        estado.className = "exito";

        estado.innerHTML =
          "<strong>Proyecto creado correctamente.</strong><br><br>" +
          "Nombre: " + datos.proyecto.nombre + "<br>" +
          "ID: " + datos.proyecto.id + "<br>" +
          "Imagen: " + datos.proyecto.imagen + "<br>" +
          "Video: " + datos.proyecto.video;

        alert(
          "Proyecto creado correctamente y guardado en R2"
        );

        formulario.reset();

      } catch (error) {

        console.error("Error:", error);

        estado.className = "error";

        estado.textContent =
          "Error: " + error.message;

        alert(
          "Error al procesar el proyecto\n\n" +
          "Detalle: " +
          error.message
        );

      } finally {

        botonCrear.disabled = false;
        botonCrear.textContent = "Crear Proyecto";

      }

    });

  </script>

</body>
</html>

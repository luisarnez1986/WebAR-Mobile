<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Creación WebAR - Panel de Administración</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f6f9;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 30px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    .campo {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="file"] {
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <header>
    Creación WebAR - Panel de Administración
  </header>

  <div class="container">

    <div class="card">

      <h1>Nuevo Proyecto</h1>

      <div class="campo">
        <input
          type="text"
          id="cliente"
          placeholder="Nombre del cliente"
        >
      </div>

      <div class="campo">
        <input
          type="text"
          id="evento"
          placeholder="Tipo de evento"
        >
      </div>

      <div class="campo">
        <input
          type="file"
          id="imagen"
          accept="image/*"
        >
      </div>

      <div class="campo">
        <input
          type="file"
          id="video"
          accept="video/*"
        >
      </div>

      <button
        type="button"
        id="crearProyecto"
      >
        Crear Proyecto
      </button>

    </div>

  </div>

  <script>
    const boton = document.getElementById("crearProyecto");

    boton.addEventListener("click", async function () {

      const cliente = document.getElementById("cliente");
      const evento = document.getElementById("evento");
      const imagen = document.getElementById("imagen");
      const video = document.getElementById("video");

      if (
        !cliente.value.trim() ||
        !evento.value.trim() ||
        imagen.files.length === 0 ||
        video.files.length === 0
      ) {
        alert(
          "Completa todos los campos y selecciona una imagen y un video."
        );
        return;
      }

      const datos = new FormData();

      datos.append(
        "cliente",
        cliente.value.trim()
      );

      datos.append(
        "evento",
        evento.value.trim()
      );

      datos.append(
        "imagen",
        imagen.files[0]
      );

      datos.append(
        "video",
        video.files[0]
      );

      boton.disabled = true;
      boton.textContent = "Procesando proyecto...";

      try {

        const respuesta = await fetch(
          "/api/upload",
          {
            method: "POST",
            body: datos
          }
        );

        const resultado = await respuesta.json();

        console.log(resultado);

        if (
          !respuesta.ok ||
          !resultado.ok
        ) {
          alert(
            resultado.mensaje +
            (
              resultado.error
                ? "\n\nDetalle: " + resultado.error
                : ""
            )
          );

          return;
        }

        alert(
          resultado.mensaje
        );

      } catch (error) {

        console.error(error);

        alert(
          "Error al conectar con la API.\n\nDetalle: " +
          error.message
        );

      } finally {

        boton.disabled = false;
        boton.textContent = "Crear Proyecto";

      }

    });
  </script>

</body>

</html>
